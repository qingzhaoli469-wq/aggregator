name: Airport Registration Guard Tests

on:
  pull_request:
    paths:
      - "subscribe/airport.py"
      - "subscribe/mailtm.py"
      - "tests/**"
      - ".github/workflows/airport-guards.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q subscribe tests
      - name: Run offline registration guard tests
        run: python -m unittest discover -s tests -v
